# Online Boutique Helm values
# 所有服务共用：镜像拉取策略、节点选择（redis 需要固定到 worker）

imagePullPolicy: IfNotPresent
nodeSelector:
  kubernetes.io/hostname: qa-cluster-worker

# frontend 对外暴露的 Service。
# Kind 没有外部负载均衡器，LoadBalancer 的 EXTERNAL-IP 会一直是 <pending>；
# 演示统一走 kubectl port-forward，因此默认关闭，避免出现 pending 资源。
frontendExternal:
  enabled: false
  type: LoadBalancer

# redis 持久化开关；false 时使用 emptyDir（与 Day 1 清单一致）
redisPersistence:
  enabled: false
  size: 1Gi
  storageClassName: standard

services:
  adservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/adservice
      tag: v0.3.4
    replicas: 1
    containerPort: 9555
    env:
      PORT: "9555"
    resources:
      requests: { cpu: 200m, memory: 180Mi }
      limits: { cpu: 300m, memory: 300Mi }
    startupProbe:
      periodSeconds: 2
      failureThreshold: 30
      timeoutSeconds: 5
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:9555", "-rpc-timeout=5s"]
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:9555", "-rpc-timeout=5s"]
    livenessProbe:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:9555", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 9555
          targetPort: 9555

  cartservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/cartservice
      tag: v0.3.1
    replicas: 1
    containerPort: 7070
    env:
      REDIS_ADDR: "redis-cart:6379"
    resources:
      requests: { cpu: 200m, memory: 64Mi }
      limits: { cpu: 300m, memory: 128Mi }
    startupProbe:
      periodSeconds: 2
      failureThreshold: 30
      timeoutSeconds: 5
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7070", "-rpc-timeout=5s"]
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7070", "-rpc-timeout=5s"]
    livenessProbe:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7070", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 7070
          targetPort: 7070

  checkoutservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/checkoutservice
      tag: v0.3.1
    replicas: 1
    containerPort: 5050
    env:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:5000"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:5050", "-rpc-timeout=5s"]
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:5050", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 5050
          targetPort: 5050

  currencyservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/currencyservice
      tag: v0.3.1
    replicas: 1
    containerPort: 7000
    env:
      PORT: "7000"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7000", "-rpc-timeout=5s"]
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:7000", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 7000
          targetPort: 7000

  emailservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/emailservice
      tag: v0.3.1
    replicas: 1
    containerPort: 8080
    env:
      PORT: "8080"
      DISABLE_PROFILER: "1"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    readinessProbe:
      periodSeconds: 5
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:8080", "-rpc-timeout=5s"]
    livenessProbe:
      periodSeconds: 5
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:8080", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 5000
          targetPort: 8080

  frontend:
    image:
      repository: local/frontend
      tag: day2
    replicas: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 50
    containerPort: 8080
    env:
      PORT: "8080"
      DISABLE_METADATA_DETECTION: "1"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      AD_SERVICE_ADDR: "adservice:9555"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    readinessProbe:
      initialDelaySeconds: 10
      httpGet:
        path: /_healthz
        port: 8080
        httpHeaders:
          - name: Cookie
            value: shop_session-id=x-readiness-probe
    livenessProbe:
      initialDelaySeconds: 10
      httpGet:
        path: /_healthz
        port: 8080
        httpHeaders:
          - name: Cookie
            value: shop_session-id=x-liveness-probe
    service:
      ports:
        - name: http
          port: 80
          targetPort: 8080

  paymentservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/paymentservice
      tag: v0.3.1
    replicas: 1
    containerPort: 50051
    env:
      PORT: "50051"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051", "-rpc-timeout=5s"]
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 50051
          targetPort: 50051

  productcatalogservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/productcatalogservice
      tag: v0.3.1
    replicas: 1
    containerPort: 3550
    env:
      PORT: "3550"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    readinessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:3550", "-rpc-timeout=5s"]
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:3550", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 3550
          targetPort: 3550

  recommendationservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/recommendationservice
      tag: v0.3.1
    replicas: 1
    containerPort: 8080
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
    resources:
      requests: { cpu: 100m, memory: 220Mi }
      limits: { cpu: 200m, memory: 450Mi }
    readinessProbe:
      periodSeconds: 5
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:8080", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 8080
          targetPort: 8080

  redis-cart:
    image:
      repository: redis
      tag: 7.4-alpine
    replicas: 1
    containerName: redis
    containerPort: 6379
    resources:
      requests: { cpu: 70m, memory: 200Mi }
      limits: { cpu: 125m, memory: 256Mi }
    readinessProbe:
      periodSeconds: 5
      tcpSocket:
        port: 6379
    livenessProbe:
      periodSeconds: 5
      tcpSocket:
        port: 6379
    volumeMounts:
      - name: redis-data
        mountPath: /data
    service:
      ports:
        - name: redis
          port: 6379
          targetPort: 6379

  shippingservice:
    image:
      repository: gcr.io/google-samples/microservices-demo/shippingservice
      tag: v0.3.1
    replicas: 1
    containerPort: 50051
    env:
      PORT: "50051"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    readinessProbe:
      periodSeconds: 5
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051", "-rpc-timeout=5s"]
    livenessProbe:
      exec:
        command: ["/bin/grpc_health_probe", "-addr=:50051", "-rpc-timeout=5s"]
    service:
      ports:
        - name: grpc
          port: 50051
          targetPort: 50051
