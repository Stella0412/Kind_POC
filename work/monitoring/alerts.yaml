apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: online-boutique-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: online-boutique.rules
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"qa-helm|alert-test"}[5m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} 在 5 分钟内有重启"
            description: "namespace={{ $labels.namespace }}, container={{ $labels.container }}"

        - alert: PodNotReady
          # 排除已完成/失败的 Job Pod：它们永远不是 Ready，否则会误报。
          expr: |
            kube_pod_status_ready{condition="true", namespace="qa-helm"} == 0
            unless on(pod, namespace) kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} 持续未就绪"
            description: "namespace={{ $labels.namespace }}"

        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas{namespace="qa-helm"} != kube_deployment_status_replicas_available{namespace="qa-helm"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} 可用副本与期望不一致"
            description: "namespace={{ $labels.namespace }}，spec 与 available 副本数不一致"
