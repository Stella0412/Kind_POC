# Day 2 压测 Job：10 并发用户，持续 5 分钟，仅输出最终汇总
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgenerator
  namespace: qa-helm
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: gcr.io/google-samples/microservices-demo/loadgenerator:v0.3.1
          imagePullPolicy: IfNotPresent
          command:
            - locust
            - --host=http://frontend:80
            - --headless
            - -u
            - "10"
            - -r
            - "2"
            - --run-time
            - 5m
            - --only-summary
            - --csv=/tmp/stats
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
